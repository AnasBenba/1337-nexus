upstream backend {
    server backend:8000;
}

upstream grafana {
    server grafana:3000;
}

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /tmp/nginx/tls/tls.crt;
    ssl_certificate_key /tmp/nginx/tls/tls.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss:; frame-ancestors 'none'; form-action 'self'" always;
    client_max_body_size 3m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;

    location /api/v1/copilot/ask {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location /api/ {
        proxy_pass http://backend;
    }

    location /health {
        proxy_pass http://backend;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /grafana/ {
        proxy_pass http://grafana;
    }

    location /media/ {
        alias /media/;
    }

    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ~ ^/(projects|opportunities|applications|boards|teams|quick-actions)(/|$) {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        error_page 418 = @spa;
        proxy_pass http://backend;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    server_name localhost;

    location = /nginx_status {
        stub_status;
        access_log off;
    }
}