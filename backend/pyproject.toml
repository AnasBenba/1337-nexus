[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"


[project]
name = "1337-nexus-backend"
version = "0.1.0"
description = "1337 Nexus backend API"
requires-python = ">=3.12,<3.13"

dependencies = [
    # -------------------------------------------------------------------------
    # Web framework / ASGI
    # -------------------------------------------------------------------------
    "fastapi~=0.141.0",
    "uvicorn[standard]~=0.40.0",
    "python-socketio[asyncio_client]~=5.15.0",

    # -------------------------------------------------------------------------
    # Configuration / validation
    # -------------------------------------------------------------------------
    "pydantic~=2.12.0",
    "pydantic-settings~=2.11.0",
    "email-validator~=2.3.0",

    # -------------------------------------------------------------------------
    # Database
    # -------------------------------------------------------------------------
    "sqlalchemy[asyncio]~=2.0.0",
    "asyncpg~=0.31.0",
    "alembic~=1.17.0",
    "pgvector~=0.4.0",

    # -------------------------------------------------------------------------
    # Authentication / security
    # -------------------------------------------------------------------------
    "pwdlib[argon2]~=0.3.0",
    "PyJWT~=2.10.0",
    "pyotp~=2.9.0",
    "cryptography~=46.0.0",

    # -------------------------------------------------------------------------
    # HTTP clients / integrations
    # -------------------------------------------------------------------------
    "httpx~=0.28.0",

    # -------------------------------------------------------------------------
    # Collaborative canvas / CRDT
    # -------------------------------------------------------------------------
    "pycrdt==0.12.34",

    # -------------------------------------------------------------------------
    # Media / uploads
    # -------------------------------------------------------------------------
    "Pillow~=12.0.0",
    "python-multipart~=0.0.20",

    # -------------------------------------------------------------------------
    # Curriculum / RAG
    # -------------------------------------------------------------------------
    "python-frontmatter~=1.1.0",
    "tiktoken~=0.12.0",
    "pymupdf4llm~=1.28.2",
	"langchain-text-splitters~=1.1.2",

    # -------------------------------------------------------------------------
    # Markdown sanitization / rendering
    # -------------------------------------------------------------------------
    "markdown-it-py~=4.0.0",
    "bleach~=6.2.0",
]


[project.optional-dependencies]
dev = [
    # -------------------------------------------------------------------------
    # Code quality
    # -------------------------------------------------------------------------
    "ruff~=0.14.0",
    "mypy~=1.18.0",
    "import-linter~=2.9.0",

    # -------------------------------------------------------------------------
    # Testing
    # -------------------------------------------------------------------------
    "pytest~=8.4.0",
    "pytest-asyncio~=1.2.0",
    "pytest-cov~=7.0.0",
    "asgi-lifespan~=2.1.0",
]


[tool.setuptools]
package-dir = {"" = "."}


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


# =============================================================================
# Ruff
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100

extend-exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "DTZ",
    "ASYNC",
    "S",
]

ignore = [
    "S101", # assert is appropriate in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# =============================================================================
# mypy
# =============================================================================

[tool.mypy]
python_version = "3.12"
strict = true

warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

no_implicit_optional = true
strict_equality = true

# Generated migration files are intentionally excluded from strict type
# checking because Alembic revisions are migration scripts rather than
# application-domain code.
exclude = [
    "^alembic/versions/.*$",
]


# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "unit: unit tests",
    "integration: integration tests",
    "realtime: Socket.IO and realtime tests",
    "crdt: cross-language CRDT interoperability tests",
]


# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]


# =============================================================================
# Import-linter
# =============================================================================
#
# These contracts match the CURRENT use-case-oriented repository:
#
#   app/
#   ├── core/
#   ├── flows/
#   ├── admin/
#   ├── user/
#   ├── teams/
#   ├── collaboration/
#   ├── integrations/
#   ├── gamification/
#   ├── realtime/
#   ├── jobs/
#   ├── shared/
#   └── cli/
#
# The important rule is that infrastructure must not depend downward on
# application feature packages. Feature packages may consume infrastructure
# services, but core/shared infrastructure must remain reusable.
# =============================================================================

[[tool.importlinter.contracts]]
name = "Core must not import application features"
type = "forbidden"
source_modules = [
    "app.core",
]
forbidden_modules = [
    "app.flows",
    "app.admin",
    "app.user",
    "app.teams",
    "app.collaboration",
    "app.integrations",
    "app.gamification",
    "app.realtime",
    "app.jobs",
]

[[tool.importlinter.contracts]]
name = "Shared must not import application features"
type = "forbidden"
source_modules = [
    "app.shared",
]
forbidden_modules = [
    "app.flows",
    "app.admin",
    "app.user",
    "app.teams",
    "app.collaboration",
    "app.integrations",
    "app.gamification",
]

[[tool.importlinter.contracts]]
name = "Infrastructure must not import CLI"
type = "forbidden"
source_modules = [
    "app.core",
    "app.shared",
    "app.realtime",
    "app.jobs",
]
forbidden_modules = [
    "app.cli",
]