[project]
name = "1337-nexus-backend"
version = "0.1.0"
description = "1337 Nexus backend API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi~=0.141.0",
    "uvicorn[standard]~=0.40.0",
    "python-socketio[asyncio_client]~=5.15.0",
    "pydantic~=2.12.0",
    "pydantic-settings~=2.11.0",
    "email-validator~=2.3.0",
    "sqlalchemy[asyncio]~=2.0.0",
    "asyncpg~=0.31.0",
    "alembic~=1.17.0",
    "pgvector~=0.4.0",
    "pwdlib[argon2]~=0.3.0",
    "PyJWT~=2.10.0",
    "pyotp~=2.9.0",
    "cryptography~=46.0.0",
    "httpx~=0.28.0",
    "pycrdt==0.12.34",
    "Pillow~=12.0.0",
    "python-multipart~=0.0.20",
    "python-frontmatter~=1.1.0",
    "tiktoken~=0.12.0",
    "pymupdf4llm~=1.28.2",
    "langchain-text-splitters~=1.1.2",
    "google-genai>=1.0.0",
    "markdown-it-py~=4.0.0",
    "bleach~=6.2.0",
    "prometheus-fastapi-instrumentator~=8.1.0",
]

[tool.ruff]
line-length = 100
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"