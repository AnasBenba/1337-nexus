global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert_rules.yml
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]