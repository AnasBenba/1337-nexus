# PostgreSQL memory and connection settings for the 1337 Nexus MVP.

# Maximum number of client connections PostgreSQL accepts at one time.
# Each connection consumes resources, so this should match the application's
# connection-pool size and the memory available to the database container.
max_connections = 40

# Memory reserved for PostgreSQL's shared buffer cache.
# PostgreSQL uses this cache to keep frequently accessed table and index data
# in memory instead of repeatedly reading it from disk.
shared_buffers = 256MB

# Maximum memory available to each individual sort or hash operation before
# PostgreSQL starts using temporary files on disk. This is not a global limit:
# one query can perform several operations, and many queries can run at once.
work_mem = 8MB

# Memory reserved for maintenance operations such as creating indexes,
# VACUUM, and some database migration operations.
maintenance_work_mem = 128MB

# Maximum number of background autovacuum workers that may run simultaneously.
# Autovacuum cleans up obsolete row versions and helps prevent table bloat.
autovacuum_max_workers = 2

# Listen on every network interface inside the container.
# This allows the backend container to reach PostgreSQL through the Docker
# network at postgres:5432. PostgreSQL is still private because this Compose
# file does not publish port 5432 to the host.
listen_addresses = '*'